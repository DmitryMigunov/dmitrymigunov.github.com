<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dmitry Migunov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --soot:#070a10; --murk:#111822; --moss:#1f2a38; --mud:#4a5a70; --candle:#9dbbd8; --bone:#dfe6ee;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--soot)}
body{margin:0;background:var(--soot);color:var(--bone);font:1.15rem/1.7 "IM Fell English",Georgia,"Times New Roman",serif}
.hero{position:relative;min-height:100svh;overflow:hidden;background:linear-gradient(#3f5168 0%,#26333f 45%,#0f1620 100%)}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:78%}
.hero svg.lab{left:auto;right:0;bottom:8%;width:auto;height:50%;aspect-ratio:2/3;overflow:visible}
.title{position:relative;z-index:2;padding:clamp(2rem,9vh,6rem) clamp(1.5rem,6vw,5rem)}
h1{font-weight:400;font-size:clamp(2.6rem,9vw,6.5rem);line-height:1;letter-spacing:.01em;margin:0 0 1rem;text-shadow:0 0 30px rgba(0,0,0,.7)}
.sub{font-style:italic;font-size:clamp(1.1rem,2.4vw,1.5rem);color:#aebccc;max-width:28rem;margin:0}
.moon{position:absolute;top:6%;right:7%;margin:0;font:8px/8px "Courier New",monospace;white-space:pre;color:rgba(206,224,242,.15);pointer-events:none}
.stars{position:absolute;inset:0 0 38% 0;pointer-events:none;overflow:hidden}
.st{position:absolute;line-height:1;color:#cfe2f5;font-family:"DejaVu Sans","Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Math","Cambria Math",sans-serif;animation:tw var(--b,4s) ease-in-out infinite;animation-delay:var(--o,0s)}
@keyframes tw{0%,100%{opacity:var(--a,.5)}50%{opacity:.03}}
.shoot{position:absolute;top:8%;left:-15%;opacity:0;white-space:nowrap;color:#e6f0fa;font-size:16px;transform:rotate(16deg);animation:shoot 17s linear infinite 4s}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(16deg)}2%{opacity:.5}9%{opacity:0;transform:translate(75vw,22vh) rotate(16deg)}100%{opacity:0}}
.ground{position:absolute;left:0;right:0;bottom:0;height:9%;background:linear-gradient(#1d2a39 0%,#0f1722 45%,#070b11 100%);border-top:1px solid rgba(150,175,205,.22)}
.herd{position:absolute;left:0;right:0;bottom:4%;height:46%;z-index:0;pointer-events:none}
.mon{position:absolute;bottom:0;left:-30%;animation:walk var(--t,140s) linear infinite;animation-delay:var(--d,0s)}
.mon svg{position:static;display:block;height:100%;width:auto;aspect-ratio:1/3;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes walk{from{left:-30%}to{left:125%}}
@keyframes walkL{from{left:125%}to{left:-30%}}
.mon.rev{animation-name:walkL}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(2.2deg)}}
.haze{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(rgba(140,165,200,.10),rgba(140,165,200,.2))}
.mist{position:absolute;left:-50%;width:200%;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 18% 50%,rgba(165,190,220,.42),transparent 55%),radial-gradient(ellipse at 55% 60%,rgba(165,190,220,.34),transparent 55%),radial-gradient(ellipse at 85% 45%,rgba(165,190,220,.4),transparent 55%);animation:drift 70s ease-in-out infinite alternate}
.m1{bottom:6%;height:40%}
.m2{bottom:26%;height:36%;opacity:.75;animation-duration:110s;animation-direction:alternate-reverse}
.m3{bottom:0;height:30%;opacity:.8;animation-duration:90s}
.fr{position:absolute;left:-50%;width:200%;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 20% 60%,rgba(175,198,225,.5),transparent 60%),radial-gradient(ellipse at 60% 50%,rgba(175,198,225,.4),transparent 60%),radial-gradient(ellipse at 90% 65%,rgba(175,198,225,.46),transparent 60%);animation:drift 55s ease-in-out infinite alternate}
.f1{bottom:-4%;height:30%;opacity:.7}
.f2{bottom:8%;height:24%;opacity:.45;animation-duration:80s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(25%)}}
.fog{position:absolute;inset:auto 0 0 0;height:55%;z-index:1;background:linear-gradient(transparent,rgba(130,160,195,.35) 55%,rgba(7,10,16,.6));pointer-events:none}
.dark{position:fixed;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(circle 300px at var(--x,50%) var(--y,30%),rgba(3,6,12,0) 0%,rgba(3,6,12,.72) 100%)}
.f{animation:fl 4s infinite steps(1)}
@keyframes fl{0%,100%{opacity:.9}41%{opacity:.9}42%{opacity:.15}44%{opacity:.8}46%{opacity:.2}48%{opacity:.9}}
.blk{animation:blk var(--b,2s) steps(1) infinite;animation-delay:var(--o,0s)}
@keyframes blk{0%{opacity:1}30%{opacity:.1}38%{opacity:1}66%{opacity:.1}70%{opacity:1}100%{opacity:1}}
.pulse{animation:pls 1.3s linear infinite}
@keyframes pls{to{stroke-dashoffset:-20}}
.nt text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;font-weight:700}
@media (max-width:600px){.moon{display:none}}
@media (prefers-reduced-motion:reduce){.f,.mist,.mon,.mon svg,.blk,.pulse,.st,.shoot,.fr{animation:none}.shoot{display:none}.mon{left:var(--s,40%)}}
@media (pointer:coarse){.dark{background:radial-gradient(circle 360px at 50% 30%,rgba(3,6,12,0) 0%,rgba(3,6,12,.62) 100%)}}
</style>
</head>
<body>
<header class="hero">
  <div class="title">
    <h1>Dmitry Migunov</h1>
    <p class="sub">Programmer and site reliability engineer. I keep systems standing when the lights go out.</p>
  </div>
  <pre class="moon" id="moon" aria-hidden="true"></pre>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <svg id="town" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  <svg id="lab" class="lab" viewBox="0 0 400 600" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
    <defs>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd27a" stop-opacity=".4"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d58b"/><stop offset="1" stop-color="#8a6a2e"/></linearGradient>
      <clipPath id="lw"><rect x="226" y="300" width="84" height="96"/></clipPath>
    </defs>
    <ellipse cx="268" cy="348" rx="150" ry="140" fill="url(#halo)"/>
    <polygon points="150,620 156,235 262,150 372,230 376,620" fill="#0b1018" stroke="#1b2634" stroke-width="2"/>
    <rect x="320" y="165" width="24" height="60" fill="#0b1018"/>
    <rect x="176" y="330" width="30" height="44" fill="#070a0f" stroke="#131b26" stroke-width="2"/>
    <rect x="326" y="520" width="38" height="80" fill="#05080d"/>
    <g clip-path="url(#lw)"><rect x="226" y="300" width="84" height="96" fill="url(#wall)"/><g id="rack"></g></g>
    <rect x="226" y="300" width="84" height="96" fill="none" stroke="#05080d" stroke-width="6"/>
    <rect x="220" y="396" width="96" height="6" fill="#05080d"/>
    <rect x="306" y="548" width="30" height="24" fill="#101822" stroke="#1b2634" stroke-width="1.5"/>
    <rect class="blk" style="--b:1.4s" x="312" y="554" width="3" height="3" fill="#5dff8a"/>
    <g id="cables" fill="none" stroke-linecap="round"></g>
  </svg>
  <div class="ground"></div>
  <div class="herd" aria-hidden="true"></div>
  <div class="haze"></div>
  <div class="mist m2"></div>
  <div class="mist m1"></div>
  <div class="mist m3"></div>
  <div class="fog"></div>
  <div class="fr f2"></div>
  <div class="fr f1"></div>
</header>

<div class="dark" id="dark"></div>

<script>
(function(){
  var s=11,r=function(){s=(s*16807)%2147483647;return s/2147483647};
  function pk(a){return a[Math.floor(r()*a.length)]}
  function f(n){return Math.round(n*10)/10}
  var svg=document.getElementById('town'),signs='',nsign=0,forced=false;
  var SC=['#ff4f9a','#4fe8ff','#ff5a4a','#7dff9a','#ffd24a'],ST=['稼働中','監視','障害ゼロ','深夜営業','夜勤','居酒屋','運用'];

  function layer(fill,minH,maxH,extra){
    var x=-60,g='<g fill="'+fill+'">';
    while(x<1660){
      var w=80+r()*120,h=minH+r()*(maxH-minH),y=600-h,t=(r()-.5)*36,peak=40+r()*80;
      g+='<polygon points="'+f(x)+',620 '+f(x)+','+f(y+t/2)+' '+f(x+w/2+t)+','+f(y-peak)+' '+f(x+w)+','+f(y)+' '+f(x+w)+',620"/>';
      if(r()>.6)g+='<rect x="'+f(x+w*.65)+'" y="'+f(y-peak-10)+'" width="14" height="'+f(peak+30)+'"/>';
      g+=extra(x,y,w,h,t,peak,fill);
      x+=w-14+r()*34;
    }
    return g+'</g>';
  }
  function ant(x,y,w,t,peak,fill){
    var ax=x+w/2+t,ay=y-peak,hg=25+r()*40,o='<path stroke="'+fill+'" stroke-width="1.6" fill="none" d="M'+f(ax)+' '+f(ay)+'V'+f(ay-hg)+'M'+f(ax-9)+' '+f(ay-hg*.5)+'h18M'+f(ax-6)+' '+f(ay-hg*.8)+'h12"/>';
    if(r()<.55)o+='<circle class="blk" style="--b:'+(1.5+r()*2).toFixed(1)+'s;--o:-'+(r()*2).toFixed(1)+'s" cx="'+f(ax)+'" cy="'+f(ay-hg-2)+'" r="2.2" fill="#ff4a4a"/>';
    return o;
  }
  function dish(x,y,w,t,peak,fill){
    var px=x+w/2+t,py=y-peak,dx=px+(x+w-px)*.6,dy=py+(y-py)*.6;
    return '<path d="M'+f(dx-10)+' '+f(dy-16)+'Q'+f(dx-4)+' '+f(dy-2)+' '+f(dx+10)+' '+f(dy-10)+'Z"/><path stroke="'+fill+'" stroke-width="2" d="M'+f(dx)+' '+f(dy-8)+'V'+f(dy+3)+'"/>';
  }
  function ex2(x,y,w,h,t,peak,fill){
    var o='';if(r()<.25)o+=ant(x,y,w,t,peak,fill);else if(r()<.15)o+=dish(x,y,w,t,peak,fill);return o;
  }
  function sign(x,y,txt,c){
    var n=txt.length,H=n*25+12,o='<g class="nt'+(r()<.5?' blk':'')+'" style="--b:'+(2+r()*3).toFixed(1)+'s;--o:-'+(r()*3).toFixed(1)+'s;filter:drop-shadow(0 0 3px '+c+')">';
    o+='<rect x="'+f(x)+'" y="'+f(y)+'" width="28" height="'+H+'" rx="3" fill="#05080d" stroke="'+c+'" stroke-width="2"/>';
    for(var i=0;i<n;i++)o+='<text x="'+f(x+14)+'" y="'+f(y+23+i*25)+'" text-anchor="middle" fill="'+c+'" font-size="19">'+txt.charAt(i)+'</text>';
    return o+'</g>';
  }
  function ex3(x,y,w,h,t,peak,fill){
    var o='',n=Math.floor(r()*3);
    for(var i=0;i<n;i++){
      if(r()>.45)continue;
      var wx=x+14+r()*(w-40),wy=y+20+r()*(h*.5),cool=r()<.3;
      o+='<rect class="'+(cool||r()>.6?'f':'')+'" style="animation-delay:-'+(r()*4).toFixed(1)+'s" x="'+f(wx)+'" y="'+f(wy)+'" width="12" height="18" fill="'+(cool?'#6ec1ff':'#e3c274')+'"/>';
    }
    var want=r()<.4;
    if(!forced&&x>700&&h>=175){want=true;forced=true}
    if(want&&h>=175&&nsign<5){nsign++;signs+=sign(x+w*.28,y+26,pk(ST),pk(SC))}
    if(r()<.2)o+=ant(x,y,w,t,peak,fill);else if(r()<.12)o+=dish(x,y,w,t,peak,fill);
    return o;
  }
  function tower(x,top,c){
    var o='<g stroke="'+c+'" stroke-width="2" fill="none"><path d="M'+(x-22)+' 600L'+x+' '+top+'L'+(x+22)+' 600"/>',n=10;
    for(var i=0;i<n;i++){
      var y1=600-(600-top)*i/n,y2=600-(600-top)*(i+1)/n,w1=22*(y1-top)/(600-top),w2=22*(y2-top)/(600-top);
      o+='<path d="M'+f(x-w1)+' '+f(y1)+'L'+f(x+w2)+' '+f(y2)+'M'+f(x+w1)+' '+f(y1)+'L'+f(x-w2)+' '+f(y2)+'M'+f(x-w1)+' '+f(y1)+'H'+f(x+w1)+'"/>';
    }
    return o+'</g><circle class="blk" style="--b:2.4s" cx="'+x+'" cy="'+(top-3)+'" r="3" fill="#ff4a4a"/>';
  }
  var fogR='<rect x="0" y="230" width="1600" height="400" fill="url(#fg)"/>';
  var out='<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9db4cf" stop-opacity="0"/><stop offset="1" stop-color="#9db4cf" stop-opacity=".6"/></linearGradient><radialGradient id="lg"><stop offset="0" stop-color="#ffe4a0" stop-opacity=".5"/><stop offset="1" stop-color="#ffe4a0" stop-opacity="0"/></radialGradient></defs>';
  out+=layer('#3d4e63',230,360,function(){return ''});
  out+=tower(360,110,'#3d4e63')+tower(790,150,'#3d4e63')+tower(1220,90,'#3d4e63');
  out+=fogR;
  out+=layer('#1f2b3a',170,300,ex2);
  out+=fogR;
  out+=layer('#080b11',110,250,ex3);
  out+=signs;
  var pl='<g fill="#04070b">',wr='<g fill="none" stroke="#04070b" stroke-width="1.3">',P=[-400,180,760,1340,1920];
  for(var i=0;i<P.length;i++){
    var px=P[i];
    pl+='<rect x="'+(px-3)+'" y="290" width="6" height="320"/><rect x="'+(px-26)+'" y="300" width="52" height="4"/><rect x="'+(px-26)+'" y="318" width="52" height="3"/>';
    if(i<P.length-1){
      var nx=P[i+1],offs=[-24,24],ys=[301,320];
      for(var a=0;a<2;a++)for(var b=0;b<2;b++)wr+='<path d="M'+(px+offs[a])+' '+ys[b]+'Q'+(px+nx)/2+' '+(ys[b]+70)+' '+(nx+offs[a])+' '+ys[b]+'"/>';
    }
  }
  out+=wr+'</g>'+pl+'</g>';
  [560,1060].forEach(function(lx){
    out+='<circle class="f" cx="'+(lx+14)+'" cy="432" r="55" fill="url(#lg)"/><rect x="'+lx+'" y="440" width="3" height="170" fill="#04070b"/><path d="M'+lx+' 442q0 -18 14 -18" stroke="#04070b" stroke-width="3" fill="none"/><circle cx="'+(lx+14)+'" cy="427" r="3" fill="#ffe4a0"/>';
  });
  svg.innerHTML=out;
})();

(function(){
  var R=Math.random;
  function pk(a){return a[Math.floor(R()*a.length)]}
  function rn(a,b){return Math.round((a+R()*(b-a))*10)/10}
  function f(n){return Math.round(n*10)/10}
  function led(x,y,w,c,b){return '<rect x="'+f(x)+'" y="'+f(y)+'" width="'+w+'" height="'+w+'" fill="'+c+'"'+(b?' class="blk" style="--b:'+(0.8+R()*3).toFixed(1)+'s;--o:-'+(R()*3).toFixed(1)+'s"':'')+'/>'}
  var cols=['#5dff8a','#5dff8a','#5dff8a','#5dff8a','#ffb347','#6ec1ff','#6ec1ff'],o='',rx=236;
  o+='<rect x="236" y="306" width="64" height="90" fill="#0e131a"/>';
  for(var u=0;u<6;u++){
    var uy=310+u*14.2,t=pk(['sw','sw','sw','rt','srv']);
    o+='<rect x="'+(rx+2)+'" y="'+f(uy)+'" width="60" height="12" fill="#1a212b"/>';
    if(t=='sw'){
      for(var p=0;p<11;p++){var px=rx+5+p*5;o+='<rect x="'+px+'" y="'+f(uy+7)+'" width="3.4" height="3" fill="#06090d"/>'+led(px+.6,uy+3,2.2,pk(cols),R()<.5)}
    }else if(t=='rt'){
      o+=led(rx+6,uy+4,3,'#5dff8a',false)+led(rx+12,uy+4,3,'#6ec1ff',true)+led(rx+18,uy+4,3,'#ffb347',R()<.5)+'<rect x="'+(rx+32)+'" y="'+f(uy+4)+'" width="26" height="4" fill="#06090d"/>';
    }else{
      o+='<rect x="'+(rx+5)+'" y="'+f(uy+3)+'" width="38" height="6" fill="#0c1016"/>'+led(rx+48,uy+4,3,'#5dff8a',true)+led(rx+54,uy+4,3,pk(cols),R()<.5);
    }
  }
  document.getElementById('rack').innerHTML=o;
  function cable(d,c){
    return '<path d="'+d+'" stroke="#05080d" stroke-width="6.5"/><path d="'+d+'" stroke="'+c+'" stroke-width="2" stroke-dasharray="7 7"/><path d="'+d+'" stroke="#dfe6ee" stroke-width="2" stroke-dasharray="7 7" stroke-dashoffset="7" opacity=".85" transform="translate(1.5,0)"/><path class="pulse" d="'+d+'" stroke="#8fd8ff" stroke-width="1.5" stroke-dasharray="2 18"/>';
  }
  document.getElementById('cables').innerHTML=
    cable('M246 402C240 450 255 490 247 535C242 568 225 584 195 586C150 589 60 584 -40 588','#d98a3a')+
    cable('M284 402C292 440 278 480 286 520C290 538 300 548 310 553','#4a90d9');
})();

(function(){
  var H=document.querySelector('.herd'),R=Math.random;
  function pk(a){return a[Math.floor(R()*a.length)]}
  function rn(a,b){return Math.round((a+R()*(b-a))*10)/10}
  function f(n){return Math.round(n*10)/10}
  function P(d,w){return '<path d="'+d+'" stroke-width="'+w+'" fill="none"/>'}
  function build(){
    var k=pk(['tall','tall','stout','small','stoop']),
    bw=k=='stout'?rn(26,34):rn(14,19),
    nk=k=='tall'?rn(65,110):k=='small'?rn(8,22):k=='stoop'?rn(30,55):rn(20,40),
    sh=k=='stoop'?160:k=='small'?175:145,hip=210,cx=56,
    lean=rn(-14,14)*(k=='stoop'?1.6:1),
    hr=k=='small'?rn(14,18):rn(9,13),
    hy=sh-nk-hr*.8,hx=cx+lean/2,ty=hy-hr*1.2,
    ar=rn(0,50),hh=sh+105+ar*.5,hxr=cx+bw+8,s='';
    s+='<ellipse cx="56" cy="300" rx="30" ry="4" fill="#000" stroke="none" opacity=".5"/>';
    s+=P('M'+(cx-12)+' 300L'+(cx-9)+' '+hip+'M'+(cx+9)+' 300L'+(cx+5)+' '+hip,k=='stout'?8:5);
    s+='<path stroke="none" d="M'+f(cx-bw)+' '+hip+'Q'+f(cx-bw+2)+' '+(sh-8)+' '+cx+' '+sh+'Q'+f(cx+bw)+' '+(sh-8)+' '+f(cx+bw)+' '+hip+'Z"/>';
    s+=P('M'+cx+' '+(sh+4)+'C'+f(cx-lean)+' '+f(sh-nk*.4)+' '+f(cx+lean*1.3)+' '+f(sh-nk*.7)+' '+f(hx)+' '+f(hy),k=='stout'?9:6);
    s+=P('M'+f(cx-bw+4)+' '+(sh+14)+'Q'+f(cx-bw-16)+' '+(sh+60)+' '+f(cx-bw-8)+' '+f(hh)+'M'+f(cx+bw-4)+' '+(sh+14)+'Q'+f(cx+bw+16)+' '+(sh+60)+' '+f(hxr)+' '+f(hh),4);
    s+='<ellipse stroke="none" cx="'+f(hx)+'" cy="'+f(hy)+'" rx="'+f(hr)+'" ry="'+f(hr*1.2)+'"/>';
    var ec=pk(['#cfe2f5','#cfe2f5','#e3c274']),en=pk([2,2,1,0]);
    function E(x,y,r){return '<circle stroke="none" fill="'+ec+'" cx="'+f(x)+'" cy="'+f(y)+'" r="'+r+'"/>'}
    if(en==2)s+=E(hx-hr*.4,hy-1,1.7)+E(hx+hr*.4,hy-1,1.7);else if(en==1)s+=E(hx,hy-1,2.6);
    var h=pk(['none','top','bowler','brim','cone','none']);
    if(h=='top')s+='<rect stroke="none" x="'+f(hx-9)+'" y="'+f(ty-26)+'" width="18" height="27"/><rect stroke="none" x="'+f(hx-15)+'" y="'+f(ty-2)+'" width="30" height="4"/>';
    if(h=='bowler')s+='<path stroke="none" d="M'+f(hx-11)+' '+f(ty+2)+'Q'+f(hx-11)+' '+f(ty-17)+' '+f(hx)+' '+f(ty-17)+'Q'+f(hx+11)+' '+f(ty-17)+' '+f(hx+11)+' '+f(ty+2)+'Z"/><rect stroke="none" x="'+f(hx-16)+'" y="'+f(ty)+'" width="32" height="3"/>';
    if(h=='brim')s+='<ellipse stroke="none" cx="'+f(hx)+'" cy="'+f(ty+1)+'" rx="22" ry="3"/><path stroke="none" d="M'+f(hx-9)+' '+f(ty+1)+'L'+f(hx-5)+' '+f(ty-15)+'L'+f(hx+5)+' '+f(ty-15)+'L'+f(hx+9)+' '+f(ty+1)+'Z"/>';
    if(h=='cone')s+='<path stroke="none" d="M'+f(hx-12)+' '+f(ty+5)+'L'+f(hx)+' '+f(ty-36)+'L'+f(hx+12)+' '+f(ty+5)+'Z"/>';
    var q=R();
    if(q<.2)s+=P('M'+f(hxr)+' '+f(hh)+'v10',2)+'<circle stroke="none" fill="rgba(227,194,116,.22)" cx="'+f(hxr)+'" cy="'+f(hh+17)+'" r="18"/><rect stroke="none" fill="#e3c274" x="'+f(hxr-5)+'" y="'+f(hh+10)+'" width="10" height="14"/>';
    else if(q<.4)s+=P('M'+f(hxr)+' '+f(hh)+'L'+f(hxr+2)+' 300',3);
    else if(q<.5)s+='<ellipse stroke="none" cx="'+f(hxr+2)+'" cy="'+f(hh+14)+'" rx="12" ry="16"/>';
    return '<svg viewBox="0 -50 120 360"><g fill="#05080d" stroke="#05080d" stroke-linecap="round">'+s+'</g></svg>';
  }
  function spawn(el,first){
    var t=rn(100,220),h=rn(45,100);
    el.innerHTML=build();
    el.style.height=h+'%';
    el.style.bottom=f((100-h)*.08)+'%';
    el.style.setProperty('--t',t+'s');
    el.style.setProperty('--d',first?(-rn(0,t))+'s':'0s');
    el.style.setProperty('--s',rn(10,85)+'%');
    el.classList.toggle('rev',R()<.5);
    el.firstChild.style.animationDelay=(-rn(0,5))+'s';
  }
  for(var i=0;i<8;i++){var m=document.createElement('div');m.className='mon';H.appendChild(m);spawn(m,true)}
  H.addEventListener('animationiteration',function(e){if(e.target.parentNode===H)spawn(e.target,false)});
})();

(function(){
  var m='',ramp=' .,:;+*#',R0=9;
  for(var j=-R0;j<=R0;j++){
    var l='';
    for(var i=-R0*2;i<=R0*2;i++){
      var dd=Math.sqrt((i/2)*(i/2)+j*j);
      if(dd>R0){l+=' ';continue}
      var lit=1-((i/2)*.8+j*.6+R0)/(2*R0),n=Math.sin(i*1.7+j*2.3)*Math.cos(i*.9-j*1.3);
      var v=Math.max(0,Math.min(7,Math.round((lit*.9+n*.18)*7)));
      l+=ramp.charAt(v);
    }
    m+=l+'\n';
  }
  document.getElementById('moon').textContent=m;
  var SK=document.getElementById('stars'),SR=Math.random,sh='';
  function sp(a){return a[Math.floor(SR()*a.length)]}
  var tiny=['·','.','˙','∙','*','+','⋅','°'],mid=['✦','✧','⋆','∗','∴','∵','⁎','✶','✷','⊹'],math=['∞','∑','∫','∂','∇','π','λ','Ω','√','≈','ℵ','∅','⊕','∮','ζ','ħ','∝','⌬'],big=['★','✺','✹','✪'];
  var N=innerWidth<600?45:85;
  for(var q=0;q<N;q++){
    var z=SR(),ch,sz,al;
    if(z<.45){ch=sp(tiny);sz=10+SR()*5;al=.2}
    else if(z<.72){ch=sp(mid);sz=12+SR()*8;al=.24}
    else if(z<.96){ch=sp(math);sz=12+SR()*7;al=.15}
    else{ch=sp(big);sz=20+SR()*6;al=.3}
    sh+='<span class="st" style="left:'+(SR()*98).toFixed(1)+'%;top:'+(SR()*96).toFixed(1)+'%;font-size:'+sz.toFixed(0)+'px;--a:'+al+';--b:'+(2.5+SR()*5).toFixed(1)+'s;--o:-'+(SR()*6).toFixed(1)+'s">'+ch+'</span>';
  }
  sh+='<span class="shoot">══━━✦</span>';
  SK.innerHTML=sh;

  var d=document.getElementById('dark');
  addEventListener('pointermove',function(e){
    d.style.setProperty('--x',e.clientX+'px');
    d.style.setProperty('--y',e.clientY+'px');
  },{passive:true});
})();
</script>
